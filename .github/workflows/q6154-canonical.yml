name: q6154-canonical

on:
  push:
    branches: [q6154-canonical]
    paths:
      - 'q6154/**'
      - '.github/workflows/q6154-canonical.yml'

permissions:
  contents: write

jobs:
  canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q6154-canonical
          fetch-depth: 0
      - name: Run exact canonical computation
        run: bash q6154/run.sh 2>&1 | tee q6154/run.log
      - name: Commit output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add q6154
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Q6154 canonical output [skip ci]"
          git push origin HEAD:q6154-canonical
