name: Q5427 RSA public metadata

on:
  push:
    branches: [chatgpt-q5427-token-probe]
    paths:
      - '.github/workflows/q5427-key-metadata.yml'

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extract public modulus and exponent
        shell: bash
        run: |
          set -euo pipefail
          openssl pkey -pubin -in q5427-public-key.pem -modulus -noout \
            | sed 's/^Modulus=//' | tr 'A-F' 'a-f' > q5427-rsa-modulus.hex
          openssl pkey -pubin -in q5427-public-key.pem -text -noout \
            | sed -n 's/.*Exponent: \([0-9][0-9]*\).*/\1/p' \
            > q5427-rsa-exponent.txt
      - name: Commit metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add q5427-rsa-modulus.hex q5427-rsa-exponent.txt
          git commit -m 'Record Q5427 RSA public metadata'
          git push
