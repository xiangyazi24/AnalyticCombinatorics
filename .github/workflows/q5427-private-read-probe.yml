name: Q5427 private-read probe

on:
  push:
    branches: [chatgpt-q5427-token-probe]
    paths: ['.github/workflows/q5427-private-read-probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test repository-scoped token
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/xiangyazi24/leader.git" HEAD >/dev/null 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then echo success > q5427-private-read-result.txt; else echo "failure:$code" > q5427-private-read-result.txt; fi
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add q5427-private-read-result.txt
          git commit -m 'Record Q5427 private-read probe'
          git push
